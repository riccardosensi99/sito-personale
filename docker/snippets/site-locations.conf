# Corpo del sito, condiviso dal server HTTP e da quello HTTPS.
# Nessuna variabile di envsubst qui dentro: il path del backoffice è già risolto
# dalle map $robots_tag / $html_cache definite nel template.

root /usr/share/nginx/html;
index index.html;

# Cloudflare fa già da CDN, ma comprimere all'origine costa poco.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

server_tokens off;
client_max_body_size 8m;

# Vuoto in produzione; negli ambienti riservati contiene auth_basic (vedi 40-basic-auth.sh).
include /etc/nginx/snippets/auth.conf;
include /etc/nginx/snippets/security-headers.conf;

# Gli asset hanno l'hash nel nome: possono restare in cache per sempre.
location /assets/ {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}

location = /favicon.svg {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=604800" always;
}

location = /robots.txt {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=86400" always;
}

location = /sitemap.xml {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=86400" always;
}

# Il CV, che sta nello stesso volume delle immagini e non si distingue dal nome.
#
# È pubblico — dal sito ci si arriva con un clic — ma è un allegato, non una
# pagina: negli indici comparirebbe come un secondo risultato che compete col
# sito e mostra un recapito privato fuori dal suo contesto. Il regex viene prima
# del prefisso qui sotto, che è ciò che serve perché questa regola vinca.
location ~* ^/uploads/(?<file_caricato>.+\.pdf)$ {
  include /etc/nginx/snippets/security-headers.conf;
  alias /data/uploads/$file_caricato;
  add_header X-Robots-Tag "noindex" always;
  add_header Cache-Control "public, max-age=2592000" always;
}

# Immagini caricate dal backoffice, dal volume condiviso con l'API.
#
# In produzione $robots_tag è vuoto e l'header non viene scritto affatto: le
# copertine dei progetti negli indici delle immagini ci stanno bene, ed è il
# motivo per cui robots.txt non le blocca più. Negli ambienti di prova vale
# "noindex, nofollow" come per le pagine — la copia del sito non deve entrare
# negli indici da nessuna delle sue porte, nemmeno da quella delle immagini.
location /uploads/ {
  include /etc/nginx/snippets/security-headers.conf;
  alias /data/uploads/;
  add_header X-Robots-Tag $robots_tag always;
  add_header Cache-Control "public, max-age=2592000" always;
  try_files $uri =404;
}

# Le risposte dell'API sono i contenuti del sito in forma di dati: un motore
# deve poterle leggere per disegnare la pagina, ma indicizzarle vorrebbe dire
# mettere in fila del JSON accanto alla home. Il noindex dice esattamente questo,
# e a differenza del vecchio Disallow lascia passare chi sta renderizzando.
location /api/ {
  include /etc/nginx/snippets/security-headers.conf;
  add_header X-Robots-Tag "noindex" always;

  proxy_pass http://api:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # Dietro Cloudflare Tunnel il tratto edge → nginx è http: il protocollo che conta
  # è quello dichiarato a monte, non lo schema di questa connessione.
  proxy_set_header X-Forwarded-Proto $fwd_proto;
  proxy_read_timeout 60s;
}

# SPA: ogni rotta non statica la risolve React. Il backoffice esce di qui con
# X-Robots-Tag noindex e Cache-Control no-store grazie alle map del template.
location / {
  include /etc/nginx/snippets/security-headers.conf;
  add_header X-Robots-Tag $robots_tag always;
  add_header Cache-Control $html_cache always;
  try_files $uri $uri/ /index.html;
}
