<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#e9e6e5" />
    <meta name="color-scheme" content="light" />
    <title>Torno subito — Riccardo Sensi</title>
    <!-- Niente favicon dall'origine: quando questa pagina compare l'origine è giù. -->
    <link rel="icon" href="/__manutenzione/logo.webp" type="image/webp" />
    <!--
      Colori copiati da site.css (:root) e dalla copertina in index.html: se
      cambiano lì vanno cambiati anche qui. I font del sito sono self-hosted
      sull'origine, quindi qui non ci sono: si ripiega sui font di sistema.
    -->
    <style>
      *,
      *::before,
      *::after { box-sizing: border-box; }

      html, body { height: 100%; margin: 0; }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background: #e9e6e5;
        color: #14110f;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(16px, 4vh, 30px);
        max-width: 560px;
        text-align: center;
      }

      img {
        width: clamp(104px, 26vw, 160px);
        height: auto;
        border-radius: 50%;
        box-shadow: 0 26px 60px rgba(20, 17, 15, 0.22);
        animation: mark 760ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      h1 {
        margin: 0;
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-weight: 700;
        line-height: 0.92;
        letter-spacing: -0.03em;
      }

      h1 span {
        display: block;
        font-size: clamp(44px, 11vw, 88px);
        animation: word 640ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .ghost { color: rgba(20, 17, 15, 0.13); animation-delay: 200ms; }

      .live {
        color: transparent;
        -webkit-text-stroke: 1.6px #ff5324;
        animation-delay: 330ms;
      }

      p {
        margin: 0;
        font-size: 17px;
        line-height: 1.6;
        color: #6d6663;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        border: 1px solid rgba(20, 17, 15, 0.12);
        border-radius: 999px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 13px;
        color: #14110f;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff5324;
        animation: pulse 1.6s ease-in-out infinite;
      }

      a {
        color: #14110f;
        text-decoration-color: #ff5324;
        text-underline-offset: 3px;
      }

      @keyframes mark { from { opacity: 0; transform: scale(0.84); } }
      @keyframes word { from { opacity: 0; transform: translateY(15px); } }
      @keyframes pulse { 50% { opacity: 0.25; } }

      @media (prefers-reduced-motion: reduce) {
        img, h1 span, .dot { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/__manutenzione/logo.webp" alt="" width="160" height="160" />
      <h1>
        <span class="ghost">Torno</span>
        <span class="live">subito</span>
      </h1>
      <p>
        Il sito è momentaneamente offline per manutenzione.<br />
        Questa pagina si ricarica da sola appena torna online.
      </p>
      <span class="status" role="status"><span class="dot"></span>in attesa del server…</span>
      <p>
        Nel frattempo mi trovi su
        <a href="mailto:riccardosensi57@gmail.com">riccardosensi57@gmail.com</a>
        o su
        <a href="https://www.linkedin.com/in/riccardo-sensi-developer" rel="noopener">LinkedIn</a>.
      </p>
    </main>

    <script>
      // Ogni 20 secondi chiede la pagina all'origine; appena risponde, ricarica.
      // HEAD senza Accept: text/html, quindi il Worker non la sostituisce e lo
      // status che arriva è quello vero dell'origine.
      setInterval(async () => {
        try {
          const res = await fetch(location.href, { method: 'HEAD', cache: 'no-store' });
          if (res.ok) location.reload();
        } catch {}
      }, 20000);
    </script>
  </body>
</html>
