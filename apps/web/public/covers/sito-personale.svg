<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.34" cy="0.1" r="0.78">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#7c5cff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.86" cy="1" r="0.62">
      <stop offset="0" stop-color="#22c3e6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22c3e6" stop-opacity="0"/>
    </radialGradient>
    <!-- Alone d'appoggio dei motivi: sfumato, perche' un'ellisse a tinta piatta
         lascia un bordo netto che si legge come un ovale sopra il fondo. -->
    <radialGradient id="soft">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="220" fill="url(#bg)"/>
  <rect width="640" height="220" fill="url(#grid)"/>
  <rect width="640" height="220" fill="url(#glow2)"/>
  <rect width="640" height="220" fill="url(#glow)"/>
  <g transform="translate(320 110) skewY(-7) translate(-320 -110)">
    <rect x="170" y="52" width="112" height="116" rx="14" fill="#7c5cff" fill-opacity="0.05" stroke="#7c5cff" stroke-opacity="0.34" stroke-width="1.2"/>
    <rect x="186" y="136" width="38" height="4" rx="2" fill="#7c5cff" opacity="0.3"/>
    <rect x="294" y="52" width="112" height="116" rx="14" fill="#7c5cff" fill-opacity="0.12" stroke="#b7a5ff" stroke-opacity="0.7" stroke-width="1.2"/>
    <rect x="310" y="132" width="52" height="4" rx="2" fill="#b7a5ff" opacity="0.7"/>
    <rect x="418" y="52" width="112" height="116" rx="14" fill="#7c5cff" fill-opacity="0.05" stroke="#7c5cff" stroke-opacity="0.34" stroke-width="1.2"/>
    <rect x="434" y="136" width="38" height="4" rx="2" fill="#7c5cff" opacity="0.3"/>
  </g>
  <rect x="120" y="192" width="400" height="3" rx="1.5" fill="#7c5cff" opacity="0.14"/>
  <rect x="252" y="192" width="136" height="3" rx="1.5" fill="#b7a5ff" opacity="0.6"/>
</svg>
