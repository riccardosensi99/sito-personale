# Project name esplicito: senza, gli ambienti condividerebbero lo stesso progetto
# docker e un `down` sull'uno fermerebbe i container dell'altro. Staging lo
# sovrascrive con COMPOSE_PROJECT_NAME nel suo .env.
name: ${COMPOSE_PROJECT_NAME:-riccardosensi}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3000
      # Dentro la rete di compose il database si chiama "db", non localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      UPLOAD_DIR: /data/uploads
      GITHUB_USERNAME: ${GITHUB_USERNAME}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/health || exit 1']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: /api
        VITE_ADMIN_PATH: ${VITE_ADMIN_PATH}
        VITE_SITE_URL: ${VITE_SITE_URL}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Servono al template nginx: il path admin è sempre noindex, mentre il resto
      # del sito lo diventa solo dove ROBOTS_DEFAULT è valorizzato (staging).
      ADMIN_PATH: ${VITE_ADMIN_PATH}
      ROBOTS_DEFAULT: ${ROBOTS_DEFAULT:-}
      NGINX_ENVSUBST_FILTER: (ADMIN_PATH|ROBOTS_DEFAULT)
    ports:
      # Con Cloudflare Tunnel imposta WEB_BIND=127.0.0.1: nginx resta raggiungibile
      # solo dal server stesso e nessuna porta va aperta sul firewall.
      - '${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:80'
    volumes:
      # Sola lettura: nginx serve gli upload, a scriverli ci pensa solo l'API.
      - uploads:/data/uploads:ro

volumes:
  pgdata:
  uploads:
