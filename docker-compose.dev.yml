# Ambiente di sviluppo: hot reload su API e frontend, database esposto sull'host.
# Un solo comando:  docker compose -f docker-compose.dev.yml up
#
# In alternativa puoi avviare solo il database
#   docker compose -f docker-compose.dev.yml up db
# e far girare API e web sull'host con `npm run dev:api` / `npm run dev:web`
# (il .env punta già a localhost:5433).

name: riccardosensi-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${DB_PORT:-5434}:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-slim
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
      UPLOAD_DIR: /data/uploads
      GITHUB_USERNAME: ${GITHUB_USERNAME}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - '${API_DEV_PORT:-3000}:3000'
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
      - uploads_dev:/data/uploads
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends openssl >/dev/null &&
             npm install &&
             npx prisma migrate deploy --schema apps/api/prisma/schema.prisma &&
             npm run dev -w @rs/api"

  web:
    image: node:22-slim
    working_dir: /app
    depends_on:
      - api
    environment:
      VITE_API_URL: /api
      VITE_ADMIN_PATH: ${VITE_ADMIN_PATH}
      VITE_SITE_URL: http://localhost:5173
      # Dentro compose il proxy di Vite deve puntare al servizio, non a localhost.
      VITE_DEV_API_TARGET: http://api:3000
    ports:
      - '${WEB_DEV_PORT:-5174}:5173'
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
    command: sh -c "npm install && npm run dev -w @rs/web -- --host 0.0.0.0"

volumes:
  pgdata_dev:
  node_modules_dev:
  uploads_dev:
